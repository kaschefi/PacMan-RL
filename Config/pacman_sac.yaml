behaviors:
  PacmanAgent:
    trainer_type: sac
    hyperparameters:
      batch_size: 256
      buffer_size: 200000        # Off-policy replay buffer
      buffer_init_steps: 5000
      tau: 0.005
      steps_per_update: 4.0
      save_replay_buffer: false
      init_entcoef: 0.5          # Automatic temperature tuning
      learning_rate: 0.0003
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 20000

environment_parameters:
  num_ghosts:
    curriculum:
      - name: Lesson1_NoGhosts
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 20.0
        value: 0.0
      - name: Lesson2_OneGhost
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 18.0
        value: 1.0
      - name: Lesson3_TwoGhosts
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 22.0
        value: 2.0
      - name: Lesson4_FullGame
        value: 4.0
