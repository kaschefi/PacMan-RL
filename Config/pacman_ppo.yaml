behaviors:
  PacmanAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01                 # Entropy bonus: ensures exploration across maze corridors
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  num_ghosts:
    curriculum:
      - name: Lesson1_NoGhosts
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 20.0
        value: 0.0
      - name: Lesson2_OneGhost
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 18.0
        value: 1.0
      - name: Lesson3_TwoGhosts
        completion_criteria:
          measure: reward
          behavior: PacmanAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 22.0
        value: 2.0
      - name: Lesson4_FullGame
        value: 4.0
